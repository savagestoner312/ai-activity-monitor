[workspace]
resolver = "2"
members = [
    "crates/aimon-api-types",
    "crates/aimon-core",
    "crates/aimon-collector",
    "crates/aimon-dashboard",
    "crates/aimon-report",
    "frontend/aimon-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
