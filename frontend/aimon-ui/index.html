<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI activity on this PC</title>
  <style>
:root{--bg:#16202e;--panel:#1c2838;--line:#2a3a50;--fg:#dfe7f1;--muted:#8a9bb0;
--cmd:#f2a541;--net:#5bc0eb;--proc:#b9a7ff;--dev:#7ee0b5;--flag:#ff6b7d;
--vu-lo:#3ddc73;--vu-mid:#f2c14e;--vu-hi:#ff5c5c;
--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--code:"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#eef2f7;--panel:#fff;--line:#d6dde8;--fg:#1a2433;--muted:#5d6b7e;
--cmd:#c77a0a;--net:#1583b8;--proc:#6b55e0;--dev:#12925f;--flag:#d6334a;
--vu-lo:#1f9d4c;--vu-mid:#b8860b;--vu-hi:#c0392b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui)}
header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;font-weight:600;margin:0}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--dev);box-shadow:0 0 0 0 var(--dev);animation:p 2s infinite}
.pulse.off{background:var(--flag);animation:none}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
#clock{color:var(--muted);font-variant-numeric:tabular-nums}
#live{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto}
.gear-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
width:1.8rem;height:1.8rem;cursor:pointer;font-size:1rem;line-height:1;margin-left:.6rem;flex:none}
.gear-btn:hover{color:var(--fg);border-color:var(--fg)}
.settings-h3{font-size:.85rem;font-weight:600;margin:0 0 .5rem;color:var(--fg)}
.preset-buttons{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.preset-btn{font:inherit;font-size:.82rem;background:none;color:var(--muted);border:1px solid var(--line);
border-radius:6px;padding:.3rem .8rem;cursor:pointer}
.preset-btn.active{color:var(--fg);border-color:var(--net)}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem .75rem;margin-bottom:.75rem}
.swatch-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.8rem;color:var(--muted)}
.swatch-row input[type=color]{width:2.2rem;height:1.6rem;border:1px solid var(--line);border-radius:4px;background:none;padding:0;cursor:pointer}
.reset-btn{font:inherit;font-size:.8rem;background:none;color:var(--muted);border:1px solid var(--line);
border-radius:6px;padding:.3rem .8rem;cursor:pointer}
.reset-btn:hover{color:var(--fg)}
.settings-divider{border-top:1px solid var(--line);margin:1rem 0}
.layout-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem .75rem}
.layout-check{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--fg);cursor:pointer}
.chip{border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;font-size:.82rem;background:var(--panel)}
.chip.hot{border-color:var(--flag);color:var(--flag);font-weight:600}
main{padding:1.25rem 1.5rem;display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
h2{font-size:.95rem;font-weight:600;margin:0 0 .75rem}
.sub{color:var(--muted);font-weight:400;margin-left:.4rem}
#river{grid-column:1/-1}
.lane{display:grid;grid-template-columns:160px 1fr;align-items:center;height:34px;border-top:1px solid var(--line)}
.lane:first-of-type{border-top:0}
.lane b{font-weight:500;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:.5rem}
.track{position:relative;height:100%}
.mark{position:absolute;top:9px;width:4px;height:16px;border-radius:2px;transform:translateX(-2px)}
.mark.flag{top:6px;height:22px;width:6px;background:var(--flag)!important;box-shadow:0 0 0 2px var(--panel)}
.axis{display:grid;grid-template-columns:160px 1fr;color:var(--muted);font-size:.75rem;margin-top:.25rem}
.axis div{display:flex;justify-content:space-between}
.legend{display:flex;gap:1rem;color:var(--muted);font-size:.8rem;margin-left:auto}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:.35rem}
.row{display:flex;align-items:center;gap:.5rem}
#filters{display:flex;gap:.35rem;margin-bottom:.6rem;flex-wrap:wrap}
#filters button{font:inherit;font-size:.82rem;background:none;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.2rem .6rem;cursor:pointer}
#filters button[aria-pressed=true]{color:var(--fg);border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--net);outline-offset:2px}
#feed{max-height:460px;overflow:auto;margin:0;padding:0;list-style:none}
#feed li{display:grid;grid-template-columns:62px 8px 130px minmax(0,1fr);gap:.6rem;align-items:baseline;padding:.35rem 0;border-top:1px solid var(--line)}
#feed time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
#feed .dot{width:8px;height:8px;border-radius:50%;align-self:center}
#feed .tool{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#feed code{font:12.5px var(--code);word-break:break-all}
#feed li.flag code{color:var(--flag)}
dl{margin:0;display:grid;grid-template-columns:1fr auto;row-gap:.5rem}
dt{color:var(--muted)}dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
dd.warn{color:var(--flag)}
.ep{margin-top:.55rem}.ep span{display:flex;justify-content:space-between;font-size:.8rem}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:3px}.bar i{display:block;height:100%;background:var(--net);border-radius:2px}
.empty{color:var(--muted);padding:1rem 0}
aside{display:grid;gap:1.25rem;align-content:start}
#time-controls select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.25rem .5rem}
#time-controls button{font:inherit;font-size:.82rem;background:none;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.25rem .7rem;cursor:pointer}
#time-controls button.hot{color:var(--flag);border-color:var(--flag)}
#time-controls input[type=range]{accent-color:var(--net)}
#perf{padding:0}
.toggle-strip{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;
font:inherit;background:none;border:0;color:var(--fg);padding:1rem 1.1rem;cursor:pointer;text-align:left;border-radius:12px}
.toggle-strip:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.toggle-strip-title{display:flex;align-items:center;gap:.5rem;font-size:.95rem;font-weight:600}
.toggle-chevron{color:var(--muted);font-size:.75rem;width:.7rem;display:inline-block}
.toggle-strip-summary{font:12.5px var(--code);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:2rem}
.overlay-panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
width:min(1100px,90vw);max-height:85vh;overflow:auto;padding:1.25rem 1.5rem}
.overlay-close{position:absolute;top:1rem;right:1.1rem;background:none;border:1px solid var(--line);color:var(--muted);
border-radius:6px;width:1.8rem;height:1.8rem;cursor:pointer;font-size:.9rem;line-height:1}
.overlay-close:hover{color:var(--flag);border-color:var(--flag)}
#perf .perf-mode-label{display:block;margin-bottom:.4rem}
.perf-rows{display:grid;gap:.5rem}
.perf-row{display:grid;grid-template-columns:150px 34px repeat(3,1fr);align-items:end;gap:.9rem}
.perf-row.total{font-weight:600;padding-bottom:.35rem}
.perf-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:2px}
.perf-count{color:var(--muted);font-size:.72rem;padding-bottom:2px}
.perf-divider{border-top:1px solid var(--line);margin:.15rem 0 .35rem}
.vu-metric{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem}
.vu-ladder{display:flex;flex-direction:column-reverse;gap:1px;height:40px}
.vu-seg{width:9px;height:3px;border-radius:1px;opacity:.15;transition:opacity .15s}
.vu-seg.lit{opacity:1;box-shadow:0 0 4px currentColor}
.vu-label{font:11.5px var(--code);color:var(--muted);white-space:nowrap}
.vu-label.muted{opacity:.6}
.perf-avg{font:12.5px var(--code);color:var(--muted)}
  </style>
</head>
<body></body>
</html>
