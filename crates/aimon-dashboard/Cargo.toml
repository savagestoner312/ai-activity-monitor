[package]
name = "aimon-dashboard"
version.workspace = true
edition.workspace = true

[[bin]]
name = "aimon-dashboard"
path = "src/main.rs"

[dependencies]
aimon-core = { path = "../aimon-core" }
aimon-api-types = { path = "../aimon-api-types" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt", "net", "macros"] }
